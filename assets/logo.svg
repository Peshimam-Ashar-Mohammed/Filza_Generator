<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="filzaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="filzaGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Tech Notches -->
  <circle cx="50" cy="50" r="44" stroke="url(#filzaGrad2)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  
  <!-- Dynamic Aperture / Motion Shutter Blades -->
  <g filter="url(#glow)">
    <!-- Blade 1 -->
    <path d="M 50 16 C 65 16 78 26 82 40 L 58 48 Z" fill="url(#filzaGrad1)" opacity="0.9"/>
    <!-- Blade 2 -->
    <path d="M 84 50 C 84 65 74 78 60 82 L 52 58 Z" fill="url(#filzaGrad1)" opacity="0.8"/>
    <!-- Blade 3 -->
    <path d="M 50 84 C 35 84 22 74 18 60 L 42 52 Z" fill="url(#filzaGrad1)" opacity="0.9"/>
    <!-- Blade 4 -->
    <path d="M 16 50 C 16 35 26 22 40 18 L 48 42 Z" fill="url(#filzaGrad1)" opacity="0.85"/>
  </g>

  <!-- Central Play / Motion Prism Core -->
  <polygon points="45,38 62,50 45,62" fill="#FFFFFF" />
  <circle cx="50" cy="50" r="14" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="50" cy="50" r="5" fill="#06B6D4"/>
</svg>
